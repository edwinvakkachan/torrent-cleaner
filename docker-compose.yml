services:
  torrentcleaner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: torrentcleaner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      QB_URL: ${QB_URL}
      QB_USER: ${QB_USER}
      QB_PASS: ${QB_PASS}
      MONGO_URI: ${MONGO_URI}
      RADARR_URL: ${RADARR_URL}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_URL: ${SONARR_URL}
      SONARR_API_KEY: ${SONARR_API_KEY}
      MIN_SPEED: ${MIN_SPEED:-200000}
      MAX_RETRIES: ${MAX_RETRIES:-5}
      IGNORED_TAGS: ${IGNORED_TAGS:-predvd,malayalam,malayalm}
      ALLOW_UNHEALTHY_REMOVAL: ${ALLOW_UNHEALTHY_REMOVAL:-false}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      - torrent-cleaner-data:/app/data
      - torrent-cleaner-logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:${PORT:-3000}/ >/dev/null || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  torrent-cleaner-data:
    name: torrent-cleaner-data
  torrent-cleaner-logs:
    name: torrent-cleaner-logs
    dns:
      - 1.1.1.1
      - 1.0.0.1

    networks:
      - shared_network

    mem_limit: 256m
    mem_reservation: 128m

    cpus: 0.50

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_network:
    external: true